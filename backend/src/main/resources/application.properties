# Server Configuration
server.port=8080

# Application Name
spring.application.name=online-banking-backend

# MySQL 8 Production / Local Configuration
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bank_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Secret & Expiration (24 hours = 86400000 ms)
# Must be at least 256 bits (32 bytes) Base64 or Hex encoded for HS256
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Demo Data Initialization
app.demo.seed-data=${SEED_DEMO_DATA:true}

# Logging Configuration
logging.level.com.bank.onlinebanking=INFO
logging.level.org.springframework.security=WARN
